name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elseed-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: npm run check

      - name: Build
        run: npm run build

      - name: Discover EL.SEED D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=elseed" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          echo "$response"
          db_id=$(echo "$response" | python -c "import sys,json; d=json.load(sys.stdin); items=[x for x in d.get('result',[]) if x.get('name')=='elseed']; print(items[0].get('uuid') or items[0].get('id') if items else '')")
          if [ -z "$db_id" ]; then
            echo "D1 database named elseed was not found."
            exit 1
          fi
          echo "ELSEED_D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"
          echo "Found D1 database elseed: $db_id"

      - name: Inspect Cloudflare build output
        run: |
          find .svelte-kit -maxdepth 4 -type f | sort | tee cloudflare-structure.log

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create elseed --production-branch=main || true

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@4 pages deploy .svelte-kit/cloudflare \
            --project-name=elseed \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message }}" 2>&1 | tee cloudflare-deploy.log

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-diagnostics
          path: |
            cloudflare-structure.log
            cloudflare-deploy.log

      - name: Attach elseed.ir custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/elseed/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"elseed.ir"}')
          echo "$response"
          echo "$response" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true|"code"[[:space:]]*:[[:space:]]*8000018|"already added this custom domain"' || exit 1

      - name: Check elseed.ir domain status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/elseed/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Inspect elseed.ir apex DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_response=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones?name=elseed.ir" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          echo "$zone_response"
          zone_id=$(echo "$zone_response" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "ZONE_ID=$zone_id" >> "$GITHUB_ENV"
          curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=elseed.ir&per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json"

      - name: Ensure elseed.ir points to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          records=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=elseed.ir" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          record_id=$(echo "$records" | python -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")

          payload='{"type":"CNAME","name":"elseed.ir","content":"elseed.pages.dev","ttl":1,"proxied":true}'

          if [ -n "$record_id" ]; then
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload"
          else
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload"
          fi

      - name: Wait briefly for elseed.ir activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            response=$(curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/elseed/domains" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "$response"
            status=$(echo "$response" | python -c "import sys,json; d=json.load(sys.stdin); items=[x for x in d.get('result',[]) if x.get('name')=='elseed.ir']; print(items[0].get('status','missing') if items else 'missing')")
            echo "Custom domain status: $status"
            if [ "$status" = "active" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Custom domain is still provisioning; deployment itself is complete."
          exit 0
